spring.application.name=Colegio
spring.datasource.url=jdbc:postgresql://localhost:5432/lasalle_pensiones
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Crea o actualiza las tablas según tus entidades
spring.jpa.hibernate.ddl-auto=update

# Opcional: muestra el SQL que ejecuta Hibernate en la consola
spring.jpa.show-sql=true
server.port=8085