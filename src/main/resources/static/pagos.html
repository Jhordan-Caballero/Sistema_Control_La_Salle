<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagos · La Salle</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<aside id="nav"></aside>

<main>
    <header class="page-header">
        <h1>Registro de pagos</h1>
        <p>Cobro de cuotas en caja, con pagos parciales y control de extemporáneos</p>
    </header>

    <section class="split">
        <div class="card">
            <h2>💵 Datos del cobro</h2>
            <label>Alumno<select id="est"></select></label>
            <label>Medio de pago
                <select id="medio">
                    <option>VENTANILLA</option>
                    <option>BANCA_MOVIL</option>
                    <option>BANCO</option>
                </select>
            </label>
            <label>Nº de operación (opcional)<input id="nroOp"></label>
            <label>Cajero / usuario<input id="usuario" value="tesorero"></label>
        </div>

        <div id="cuenta" class="stack">
            <div class="card empty">Seleccione un alumno para ver sus cuotas</div>
        </div>
    </section>
</main>

<div id="toast" class="toast"></div>
<script src="js/common.js"></script>
<script>
    let cuotas = [];

    async function cargarEstudiantes() {
        fillSelect($("est"), await api("GET", "/estudiantes"),
            e => `${e.codigo} · ${e.nombres} ${e.apellidos}`, "Seleccione alumno");
    }

    async function cargarCuenta(id) {
        if (!id) {
            $("cuenta").innerHTML = `<div class="card empty">Seleccione un alumno para ver sus cuotas</div>`;
            return;
        }
        const c = await api("GET", `/estudiantes/${id}/estado-cuenta`);
        cuotas = c.cuotas;
        const pendientes = cuotas.filter(q => q.saldo > 0);

        $("cuenta").innerHTML = `
      <div class="card">
        <h2>Cuotas con saldo · ${esc(c.estudiante)}</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Concepto</th><th>Nº</th><th>Vence</th><th>Saldo</th><th>Monto</th><th></th></tr></thead>
            <tbody>
              ${pendientes.length ? pendientes.map(q => `
                <tr>
                  <td>${esc(q.concepto)}</td>
                  <td>${q.nro}</td>
                  <td>${q.vencimiento} ${q.vencida ? '<span class="badge err">Vencida</span>' : ""}</td>
                  <td>${soles(q.saldo)}</td>
                  <td><input id="m${q.id}" type="number" step="0.01" min="0.01" max="${q.saldo}"
                       value="${q.saldo}" style="width:110px;margin:0"></td>
                  <td><button class="small" onclick="pagar(${q.id})">Cobrar</button></td>
                </tr>`).join("")
            : `<tr><td colspan="6" class="empty">Sin cuotas pendientes</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2>Pagos recientes</h2>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Fecha</th><th>Monto</th><th>Medio</th><th>Operación</th><th>Tipo</th></tr></thead>
            <tbody>
              ${c.pagos.length ? c.pagos.map(p => `
                <tr>
                  <td>${p.fecha.replace("T", " ").slice(0, 16)}</td>
                  <td>${soles(p.monto)}</td>
                  <td>${esc(p.medio ?? "—")}</td>
                  <td>${esc(p.nroOperacion ?? "—")}</td>
                  <td>${p.extemporaneo ? '<span class="badge warn">Extemporáneo</span>' : '<span class="badge ok">A tiempo</span>'}</td>
                </tr>`).join("")
            : `<tr><td colspan="5" class="empty">Sin pagos registrados</td></tr>`}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    window.pagar = async id => {
        const monto = Number($("m" + id).value);
        const q = cuotas.find(x => x.id === id);
        let extemporaneo = false;

        if (q.vencida) {
            if (!confirm("Esta cuota está vencida. ¿Confirmar pago extemporáneo?")) return;
            extemporaneo = true;
        }
        try {
            await api("POST", "/pagos", {
                cuotaId: id,
                monto,
                medioPago: $("medio").value,
                nroOperacion: $("nroOp").value || null,
                confirmarExtemporaneo: extemporaneo,
                usuario: $("usuario").value || "tesorero"
            });
            toast("Pago registrado: " + soles(monto));
            cargarCuenta($("est").value);
        } catch (err) { toast(err.message, false); }
    };

    $("est").addEventListener("change", e => cargarCuenta(e.target.value));

    cargarEstudiantes().catch(e => toast(e.message, false));
</script>
</body>
</html>
